<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="baitap11.css" class="">
</head>
<body>
    <div class="title">
        <h1 class="">thư viện ảnh Việt nam</h1>
        <p>bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figure/figcaption</p>   
    </div>
    <div class="container">
        <figure class="card">
            <img src="1-vinh-ha-long.jpg" alt="vịnh hạ long" class="">
            <figcaption>hình 1.Vịnh Hạ Long</figcaption>
        </figure>
         <figure class="card">
            <img src="2-son-doong.jpg" alt="son doong" class="">
            <figcaption>hình 2.Hang Son Doong</figcaption>
        </figure>
         <figure class="card">
            <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" class="">
            <figcaption>hình 3.Thác Bản Gióc</figcaption>
        </figure>
         <figure class="card">
            <img src="4-fansipan.jpg" alt="Fansipan" class="">
            <figcaption>hình 4. Fansipan</figcaption>
        </figure>
         <figure class="card">
            <img src="5-mekong.jpg" alt="mekong" class="">
            <figcaption>hình 5.Đồng bằng sông Cửu Long</figcaption>
        </figure>
         <figure class="card">
            <img src="6-phong-nha.jpg" alt="động phong nha" class="">
            <figcaption>hình 6.Động Phong Nha</figcaption>
        </figure>
    </div>
</body>
</html>
