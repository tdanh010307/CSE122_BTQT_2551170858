<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký</title>
    <!-- Nhúng CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng file CSS tùy chỉnh -->
    <link rel="stylesheet" href="baitap26.css">
</head>

<body>

    <div class="form-container">
        <!-- Thẻ Card bọc ngoài form -->
        <div class="card shadow rounded-3 border-0">
            <!-- Header của Card -->
            <div class="card-header bg-success text-white text-center py-3 border-0">
                <h4 class="mb-0 fw-normal">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>

            <!-- Thân Card chứa nội dung Form -->
            <div class="card-body p-4">
                <!-- Thẻ form với hệ thống lưới g-3 -->
                <form class="row g-3">

                    <!-- Họ và tên -->
                    <div class="col-md-6">
                        <label for="fullName" class="form-label mb-1">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                    </div>

                    <!-- Mã sinh viên -->
                    <div class="col-md-6">
                        <label for="studentId" class="form-label mb-1">Mã sinh viên</label>
                        <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label mb-1">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="col-md-6">
                        <label for="phone" class="form-label mb-1">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                    </div>

                    <!-- Trình độ -->
                    <div class="col-12 mt-3">
                        <label class="form-label d-block mb-2">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Cơ bản"
                                checked required>
                            <label class="form-check-label" for="levelBasic">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="levelGood" value="Khá">
                            <label class="form-check-label" for="levelGood">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="levelExcellent" value="Tốt">
                            <label class="form-check-label" for="levelExcellent">Tốt</label>
                        </div>
                    </div>

                    <!-- Chọn lớp -->
                    <div class="col-12 mt-3">
                        <label for="classSelect" class="form-label mb-1">Chọn lớp</label>
                        <select class="form-select" id="classSelect" required>
                            <option value="67CNTT1" selected>67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67CNTT3">67CNTT3</option>
                        </select>
                    </div>

                    <!-- Checkbox cam kết -->
                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="commitment" required>
                            <label class="form-check-label" for="commitment">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>

                    <!-- Nút bấm -->
                    <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-outline-secondary px-3">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
