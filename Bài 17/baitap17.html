<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra biểu mẫu bằng JavaScript</title>
    <link rel="stylesheet" href="baitap17.css">
</head>

<body>
    <div class="form-group">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname">
                <div class="error-msg" id="fullnameError">Họ tên không được để trống</div>
                <div class="success-msg" id="fullnameSuccess">✓ Hợp lệ</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email">
                <div class="error-mgs" id="emailError">X Email Không hợp lệ(thiếu tên miền)</div>
                <div class="success-mgs" id="emailSuccess">✓ Hợp lệ</div>

            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password">
                <div class="error-mgs" id="passwordError">X Mật khẩu phải có ít nhất 6 ký tự</div>
                <div class="success-mgs" id="passwordSuccess">✓ Hợp lệ</div>

            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <div class="error-mgs" id="confirmPasswordError">X Email Không hợp lệ(thiếu tên miền)</div>
                <div class="success-mgs" id="confirmPasswordSuccess">✓ Hợp lệ</div>

            </div>
            <button type="submit">Đăng ký</button>

        </form>
    </div>

    <script src="baitap17.js"></script>
</body>

</html>
