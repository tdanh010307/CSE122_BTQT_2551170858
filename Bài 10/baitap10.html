<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang liên hệ</title>
    <link rel="stylesheet" href="baitap10.css" class="">
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>
        <div class="box">
            <div class="name">
                <label for="" class="">họ và tên</label>
                <input type="text">
            </div>
            <div class="email">
                <label for="" class="">Email</label>
                <input type="email">
            </div>
            <div class="phone">
                <label for="" class="">Số điện thoại</label>
                <input type="tel">
            </div>
            <div class="topic">
                <label for="" class="">Chủ đề</label>
                <select>
                    <option value="khoa-hoc" class="">hỏi về khóa học</option>
                    <option value="lo-trinh" class="">hỏi về lộ trình</option>
                </select> 
            </div>
            <div class="content">
                <label for="" class="">Nội dung</label>
                <textarea row="4"></textarea>
            </div>
            <div class="agreement">
                <input type="checkbox" id="agree">
                <label for="agree">Tôi đồng ý nhận email phản hồi</label>
            </div>
            <div class="button">
                <button class="send">Gửi liên hệ</button>
                <button class="reset">Nhập lại</button>
            </div>
        </div>
    </div>
</body>
</html>
