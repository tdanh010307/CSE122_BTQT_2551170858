<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch</title>
    <link rel="stylesheet" href="baitap12.css">
</head>

<body>
    <div class="nentrang">
        <div class="inlich">
            <p id="displayYears">2026</p>
            <h2 id="displayMonth">Tháng 12</h2>
            <h1 id="displayDay">24</h1>
            <h2 id="displayDayOfWeek">Thứ hai</h2>
        </div>
        <p class="loichao">Chào buổi sáng!</p>
        <div class="nhaplich">
            <div>
                <p for="day">Ngày</p>
                <input id="Day" type="text">
            </div>
            <div>
                <p for="month">Tháng</p>
                <input id="Month" type="text">
            </div>
            <div>
                <p for="year">Năm</p>
                <input id="Years" type="text">
            </div>
            <div>
                <button id="printBtn">In lịch</button>
            </div>
        </div>
    </div>
    <script src="baitap12.js"></script>
</body>

</html>
