<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 — Bảng điều khiển (Bootstrap)</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- File CSS Tùy Chỉnh -->
    <link rel="stylesheet" href="bai30.css">
</head>

<body>

    <div class="d-flex">
        <!-- 1. SIDEBAR MENU DỌC (Rộng 230px, Nền #212529, Chữ #FFFFFF) -->
        <aside class="sidebar d-flex flex-column">
            <div class="brand-title">CSE.TLU Admin</div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Điểm số</a>
                </li>
            </ul>
        </aside>

        <!-- 2. KHU VỰC NỘI DUNG CHÍNH -->
        <main class="main-content">

            <!-- HEADER KHU VỰC CHÍNH -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-dark">Bảng điều khiển</h4>
                <div>
                    <span class="badge bg-warning text-dark me-2 px-2 py-2 fw-normal">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3">Xuất báo cáo</button>
                </div>
            </div>

            <!-- 3. HÀNG 4 THẺ THỐNG KÊ (col-md-3) -->
            <div class="row g-3 mb-4">

                <!-- Thẻ 1: Sinh viên -->
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card card-stat p-3">
                        <div class="stat-label mb-1">Sinh viên</div>
                        <div class="stat-value mb-2">128</div>
                        <div class="progress progress-stat">
                            <div class="progress-bar bg-custom-blue" role="progressbar" style="width: 70%;"
                                aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <!-- Thẻ 2: Đã nộp -->
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card card-stat p-3">
                        <div class="stat-label mb-1">Đã nộp</div>
                        <div class="stat-value mb-2">96</div>
                        <div class="progress progress-stat">
                            <div class="progress-bar bg-custom-green" role="progressbar" style="width: 75%;"
                                aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <!-- Thẻ 3: Chưa nộp -->
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card card-stat p-3">
                        <div class="stat-label mb-1">Chưa nộp</div>
                        <div class="stat-value mb-2">32</div>
                        <div class="progress progress-stat">
                            <div class="progress-bar bg-custom-red" role="progressbar" style="width: 25%;"
                                aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <!-- Thẻ 4: Điểm TB -->
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card card-stat p-3">
                        <div class="stat-label mb-1">Điểm TB</div>
                        <div class="stat-value mb-2">7.8</div>
                        <div class="progress progress-stat">
                            <div class="progress-bar bg-custom-yellow" role="progressbar" style="width: 78%;"
                                aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 4. DANH SÁCH TIẾN ĐỘ THEO CHƯƠNG -->
            <div class="card card-stat">
                <div class="card-header bg-white border-0 pt-3 px-3 pb-2">
                    <h6 class="fw-bold m-0 text-secondary" style="font-size: 0.85rem;">Tiến độ theo chương</h6>
                </div>
                <ul class="list-group list-group-flush chapter-list">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 1 — HTML5</span>
                        <span class="badge bg-success rounded-1 px-2 py-1">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 2 — JavaScript</span>
                        <span class="badge bg-info text-white rounded-1 px-2 py-1">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 3 — CSS3</span>
                        <span class="badge bg-primary rounded-1 px-2 py-1">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary rounded-1 px-2 py-1">45%</span>
                    </li>
                </ul>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
